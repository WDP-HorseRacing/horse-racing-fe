services:
  web:
    image: ${GHCR_IMAGE:-ghcr.io/wdp-horseracing/horse-racing-fe}:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
