services:
  web:
    image: ${GHCR_IMAGE:-ghcr.io/wdp-horseracing/horse-racing-fe}:${IMAGE_TAG:-latest}
    expose:
      - "80"
    restart: unless-stopped
    networks:
      app:
        aliases:
          - horse-racing-fe
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app:
    name: racehorse-net
    external: true
